<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Study <span>Tasks</span></h1>
      <p class="sub" id="today"></p>
    </div>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
  </header>

  <section class="summary" aria-live="polite">
    <div class="summary-top"><span id="sumText"></span><span id="sumLate"></span></div>
    <div class="bar" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
  </section>

  <div class="toolbar">
    <div class="seg" id="statusSeg" role="group" aria-label="Filter by status">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="active" aria-pressed="false">To do</button>
      <button data-v="done" aria-pressed="false">Done</button>
    </div>
    <select id="prio" aria-label="Filter by priority">
      <option value="all">Any priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
    </select>
    <select id="sort" aria-label="Sort tasks">
      <option value="due">Sort: due date</option><option value="prio">Sort: priority</option><option value="new">Sort: newest</option>
    </select>
    <span class="spacer"></span>
    <button class="primary" id="add">+ New task</button>
  </div>

  <ul id="list"></ul>
</div>

<dialog id="dlg">
  <form id="form" novalidate>
    <h2 id="dlgTitle">New task</h2>
    <label>Title<input type="text" id="fTitle" maxlength="100" placeholder="e.g. Chemistry lab report" required></label>
    <label>Description <textarea id="fDesc" rows="3" maxlength="400" placeholder="Chapters, pages, what to hand in…"></textarea></label>
    <div class="row">
      <label>Due date<input type="date" id="fDue" required></label>
      <label>Priority<select id="fPrio"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
    </div>
    <p class="err" id="err" role="alert"></p>
    <div class="dlg-acts"><button type="button" class="ghost" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Add task</button></div>
  </form>
</dialog>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="undo">Undo</button></div>

<script src="script.js"></script>
</body>
</html>
